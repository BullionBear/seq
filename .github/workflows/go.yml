name: Go CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache-dependency-path: go.sum

    - name: Verify dependencies
      run: go mod verify

    - name: Download dependencies
      run: go mod download

    - name: Run all tests
      run: go test -v -race -short -coverprofile=coverage.out ./...

    - name: Run benchmarks with allocation metrics
      run: go test -benchmem -bench=. ./... 2>&1 | tee benchmark.txt || true

    - name: Run zero-allocation verification test
      run: go test -v -run TestLogger_ZeroAllocation ./core/logger/

    - name: Run file allocation test
      run: go test -v -run TestLogger_FileAllocation ./core/logger/

    # - name: Run escape analysis
    #   run: |
    #     echo "Running escape analysis..."
    #     go build -gcflags="-m" ./... 2>&1 | tee escape-analysis.txt || true
    #     echo "Escape analysis complete. Showing allocations to heap:"
    #     grep -E "(escapes|moved to heap)" escape-analysis.txt || echo "No heap allocations detected (or using different output format)"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.out
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail CI if linting fails (e.g., due to Go version incompatibility)
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache-dependency-path: go.sum

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v4
      continue-on-error: true
      with:
        version: latest
        args: --timeout=5m

  release:
    # Build and publish a GitHub Release when a version tag is pushed
    # (typically on a commit already on main).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify tag commit is on main
      run: |
        git fetch origin main
        if ! git merge-base --is-ancestor HEAD origin/main; then
          echo "Tagged commit is not reachable from origin/main; refusing release."
          exit 1
        fi

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache-dependency-path: go.sum

    - name: Build release binary
      run: make build

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: bin/seq-linux-amd64
        generate_release_notes: true
        fail_on_unmatched_files: true

