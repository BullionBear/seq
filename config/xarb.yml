trading_mode: paper  # set to live to enable venue order submit/cancel

logger:
  level: debug
  path: /root/seq/logs/xarb-uni-usdt.log
  max_byte_size: 10485760
  max_backup_files: 5

msgbus:
  msglog:
    enabled: true
    dir: ./logs/

catalog:
  instruments: ./instruments.json  # relative to this config file's directory
  # API keys/secrets are injected via environment variables (or copy to a gitignored *.local.yml)
  accounts:
    - name: bybit-hephe
      exchange: Bybit
      api_keys:
        - name: bybit-hephe-hmac
          type: HMAC
          key: ${BYBIT_HEPHE_API_KEY}
          secret: ${BYBIT_HEPHE_API_SECRET}
      wallets:
        - name: bybit-hephe-unified
          type: unified
    - name: bn-hephe
      exchange: Binance
      api_keys:
        - name: bn-hephe-ed25519
          type: ED25519
          key: ${BN_HEPHE_API_KEY}
          secret: ${BN_HEPHE_API_SECRET}
      wallets:
        - name: bn-hephe-spot
          type: spot

execrouter:
  - account: bybit-hephe
    wallet: bybit-hephe-unified
    api: bybit-hephe-hmac
  - account: bn-hephe
    wallet: bn-hephe-spot
    api: bn-hephe-ed25519


datarouter:
  - symbol: BINANCE_SPOT_UNIUSDT
    depth:
      type: delta
      push_rate: 100ms
  - symbol: BYBIT_SPOT_UNIUSDT
    depth:
      levels: 50


node:
  engine:
    data:
      actor:
        - type: orderbook
          name: orderbook-binance
          config:
            symbol: BINANCE_SPOT_UNIUSDT
        - type: orderbook
          name: orderbook-bybit
          config:
            symbol: BYBIT_SPOT_UNIUSDT
    
    execution:
      actor:
        - type: oms
          name: oms
          config:
            
    
    portfolio:
      actor:
        - type: balance
          name: balance-bybit-unified
          config:
            wallet: bybit-hephe-unified
        - type: balance
          name: balance-bn-spot
          config:
            wallet: bn-hephe-spot

    risk:
      actor:
        - type: leakybucket
          name: rate-limiter-bybit
          config:
            leak_rate: 2 # requests per second
            capacity: 60
            account: bybit-hephe
        - type: tpnl
          name: tpnl-1h
          config:
            window: 1h
      checker:
        - type: ratelimit
          config:
            account: bybit-hephe
        - type: tpnl
          config:
            window: 1h
            stop_loss: -5.0

    strategy:
      actor:
        - type: xarb
          name: xarb-uni-buy-5bps
          config:
            quoting_symbol_universal_ticker: BINANCE_SPOT_UNIUSDT
            hedging_symbol_universal_ticker: BYBIT_SPOT_UNIUSDT
            quoting_wallet: bn-hephe-spot
            hedging_wallet: bybit-hephe-unified
            side: BUY
            profit_bps: 10
            qty: 5
            price_tolerance_bps: 5
            order_ttl: 2000ms

        - type: xarb
          name: xarb-uni-sell-5bps
          config:
            quoting_symbol_universal_ticker: BINANCE_SPOT_UNIUSDT
            hedging_symbol_universal_ticker: BYBIT_SPOT_UNIUSDT
            quoting_wallet: bn-hephe-spot
            hedging_wallet: bybit-hephe-unified
            side: SELL
            profit_bps: 10
            qty: 5
            price_tolerance_bps: 5
            order_ttl: 2000ms

