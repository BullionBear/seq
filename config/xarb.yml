execrouter:
  - id: 6
    account: bybit-hephe
    wallet: bybit-hephe-unified
    api: bybit-hephe-hmac
  - id: 7
    account: bn-hephe
    wallet: bn-hephe-spot
    api: bn-hephe-ed25519


datarouter:
  - symbol: BINANCE_SPOT_UNIUSDT
    depth:
      type: delta
      push_rate: 100ms
  - symbol: BYBIT_SPOT_UNIUSDT
    depth:
      levels: 50


node:
  engine:
    data:
      actor:
        - type: orderbook
          name: orderbook-binance
          config:
            symbol: BINANCE_SPOT_UNIUSDT
        - type: orderbook
          name: orderbook-bybit
          config:
            symbol: BYBIT_SPOT_UNIUSDT
    
    execution:
      actor:
        - type: oms
          name: oms
          config:
            
    
    portfolio:
      actor:
        - type: balance
          name: balance-bybit-unified
          config:
            wallet: bybit-hephe-unified
        - type: balance
          name: balance-bn-spot
          config:
            wallet: bn-hephe-spot

    strategy:
      actor:
        - type: xarb
          name: xarb-uni-buy-15bps
          config:
            quoting_symbol_universal_ticker: BYBIT_SPOT_UNIUSDT
            hedging_symbol_universal_ticker: BINANCE_SPOT_UNIUSDT
            quoting_wallet: bybit-hephe-unified
            hedging_wallet: bn-hephe-spot
            side: BUY
            profit_bps: 5
            qty: 10
            price_tolerance_bps: 10

