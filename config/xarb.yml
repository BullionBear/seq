logger:
  level: info
  output: stdout  # "stdout" or "file"
  path: /root/seq/logs/xarb-uni-usdt.log  # Required when output is "file"
  max_byte_size: 10485760  # 10 MB in bytes (0 = no rotation)
  max_backup_files: 5  # Maximum number of backup files to keep (0 = keep all)

msgbus:
  msglog:
    enabled: true
    dir: ./logs/

catalog:
