logger:
  level: debug
  path: /root/seq/logs/xarb-uni-usdt.log
  max_byte_size: 10485760
  max_backup_files: 5

msgbus:
  msglog:
    enabled: true
    dir: ./logs/

catalog:
  base_url: https://capi.lynxlinkage.com
  api_token: api_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI0IiwidHlwZSI6ImFwaV9hY2Nlc3MiLCJleHAiOjIwODY0MDU4MTcsImlhdCI6MTc3MTA0NTgxNy45NDI2NTgsImp0aSI6IndzUTJmQnFwaXc0In0.0Tm3yo-rcNmhOvwl3UB2Mc_WMxejDROOaRIXLDQKSxw

execrouter:
  - account: bybit-hephe
    wallet: bybit-hephe-unified
    api: bybit-hephe-hmac
  - account: bn-hephe
    wallet: bn-hephe-spot
    api: bn-hephe-ed25519


datarouter:
  - symbol: BINANCE_SPOT_UNIUSDT
    depth:
      type: delta
      push_rate: 100ms
  - symbol: BYBIT_SPOT_UNIUSDT
    depth:
      levels: 50


node:
  engine:
    data:
      actor:
        - type: orderbook
          name: orderbook-binance
          config:
            symbol: BINANCE_SPOT_UNIUSDT
        - type: orderbook
          name: orderbook-bybit
          config:
            symbol: BYBIT_SPOT_UNIUSDT
    
    execution:
      actor:
        - type: oms
          name: oms
          config:
            
    
    portfolio:
      actor:
        - type: balance
          name: balance-bybit-unified
          config:
            wallet: bybit-hephe-unified
        - type: balance
          name: balance-bn-spot
          config:
            wallet: bn-hephe-spot

    risk:
      actor:
        - type: leakybucket
          name: rate-limiter-bybit
          config:
            leak_rate: 2 # requests per second
            capacity: 60
            account: bybit-hephe
        - type: tpnl
          name: tpnl-1h
          config:
            window: 1h
      checker:
        - type: ratelimit
          config:
            account: bybit-hephe
        - type: tpnl
          config:
            window: 1h
            stop_loss: -5.0

    strategy:
      actor:
        - type: xarb
          name: xarb-uni-buy-5bps
          config:
            quoting_symbol_universal_ticker: BINANCE_SPOT_UNIUSDT
            hedging_symbol_universal_ticker: BYBIT_SPOT_UNIUSDT
            quoting_wallet: bn-hephe-spot
            hedging_wallet: bybit-hephe-unified
            side: BUY
            profit_bps: 7
            qty: 5
            price_tolerance_bps: 2
            order_ttl: 200ms

        - type: xarb
          name: xarb-uni-sell-5bps
          config:
            quoting_symbol_universal_ticker: BINANCE_SPOT_UNIUSDT
            hedging_symbol_universal_ticker: BYBIT_SPOT_UNIUSDT
            quoting_wallet: bn-hephe-spot
            hedging_wallet: bybit-hephe-unified
            side: SELL
            profit_bps: 7
            qty: 5
            price_tolerance_bps: 2
            order_ttl: 200ms

