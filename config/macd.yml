trading_mode: paper  # set to live to enable venue order submit/cancel

logger:
  level: debug
  path: /root/seq/logs/macd-eth-usdt.log
  max_byte_size: 10485760
  max_backup_files: 5

msgbus:
  msglog:
    enabled: true
    dir: ./logs/

catalog:
  instruments: ./instruments.json  # relative to this config file's directory
  # API keys/secrets are injected via environment variables (or copy to a gitignored *.local.yml)
  accounts:
    - name: bn-hephe
      exchange: Binance
      api_keys:
        - name: bn-hephe-ed25519
          type: ED25519
          key: ${BN_HEPHE_API_KEY}
          secret: ${BN_HEPHE_API_SECRET}
      wallets:
        - name: bn-hephe-spot
          type: spot

execrouter:
  - account: bn-hephe
    wallet: bn-hephe-spot
    api: bn-hephe-ed25519

datarouter:
  - symbol: BINANCE_SPOT_ETHUSDT
    depth:
      type: delta
      push_rate: 100ms
    kline:
      interval: 1m

node:
  engine:
    data:
      actor:
        - type: orderbook
          name: orderbook-binance
          config:
            symbol: BINANCE_SPOT_ETHUSDT

    execution:
      actor:
        - type: oms
          name: oms
          config:

    portfolio:
      actor:
        - type: balance
          name: balance-bn-spot
          config:
            wallet: bn-hephe-spot

    risk:
      actor:
        - type: leakybucket
          name: rate-limiter-bn
          config:
            leak_rate: 2 # requests per second
            capacity: 60
            account: bn-hephe
        - type: tpnl
          name: tpnl-1h
          config:
            window: 1h
      checker:
        - type: ratelimit
          config:
            account: bn-hephe
        - type: tpnl
          config:
            window: 1h
            stop_loss: -5.0

    strategy:
      actor:
        - type: macd
          name: macd-eth
          config:
            universal_ticker: BINANCE_SPOT_ETHUSDT
            wallet: bn-hephe-spot
            fast_period: 12
            slow_period: 26
            signal_period: 9
            exec_qty: 0.01
