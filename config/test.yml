# Default paper. Live requires trading_mode=live AND SEQ_ALLOW_LIVE=1 (CEO/board approval).
trading_mode: paper

logger:
  level: debug
  path: ./logs/test.log
  max_byte_size: 10485760
  max_backup_files: 5

msgbus:
  msglog:
    enabled: true
    dir: ./logs/

catalog:
  base_url: https://capi.lynxlinkage.com
  # Set CATALOG_API_TOKEN in the environment, or copy to a gitignored *.local.yml
  api_token: ${CATALOG_API_TOKEN}

execrouter:
  - account: bybit-hephe
    wallet: bybit-hephe-unified
    api: bybit-hephe-hmac
  - account: bn-hephe
    wallet: bn-hephe-spot
    api: bn-hephe-ed25519


datarouter:
  - symbol: BINANCE_SPOT_UNIUSDT
    depth:
      type: delta
      push_rate: 100ms
  - symbol: BYBIT_SPOT_UNIUSDT
    depth:
      levels: 50


node:
  engine:
    data:
      actor:
        - type: orderbook
          name: orderbook-binance
          config:
            symbol: BINANCE_SPOT_UNIUSDT
        - type: orderbook
          name: orderbook-bybit
          config:
            symbol: BYBIT_SPOT_UNIUSDT
    
    execution:
      actor:
        - type: oms
          name: oms
          config:
            
    
