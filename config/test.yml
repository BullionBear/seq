# Default paper. Live requires trading_mode=live AND SEQ_ALLOW_LIVE=1 (CEO/board approval).
trading_mode: paper

logger:
  level: debug
  path: ./logs/test.log
  max_byte_size: 10485760
  max_backup_files: 5

msgbus:
  msglog:
    enabled: true
    dir: ./logs/

catalog:
  instruments: ./instruments.json  # relative to this config file's directory
  # API keys/secrets are injected via environment variables (or copy to a gitignored *.local.yml)
  accounts:
    - name: bybit-hephe
      exchange: Bybit
      api_keys:
        - name: bybit-hephe-hmac
          type: HMAC
          key: ${BYBIT_HEPHE_API_KEY}
          secret: ${BYBIT_HEPHE_API_SECRET}
      wallets:
        - name: bybit-hephe-unified
          type: unified
    - name: bn-hephe
      exchange: Binance
      api_keys:
        - name: bn-hephe-ed25519
          type: ED25519
          key: ${BN_HEPHE_API_KEY}
          secret: ${BN_HEPHE_API_SECRET}
      wallets:
        - name: bn-hephe-spot
          type: spot

execrouter:
  - account: bybit-hephe
    wallet: bybit-hephe-unified
    api: bybit-hephe-hmac
  - account: bn-hephe
    wallet: bn-hephe-spot
    api: bn-hephe-ed25519


datarouter:
  - symbol: BINANCE_SPOT_UNIUSDT
    depth:
      type: delta
      push_rate: 100ms
  - symbol: BYBIT_SPOT_UNIUSDT
    depth:
      levels: 50


node:
  engine:
    data:
      actor:
        - type: orderbook
          name: orderbook-binance
          config:
            symbol: BINANCE_SPOT_UNIUSDT
        - type: orderbook
          name: orderbook-bybit
          config:
            symbol: BYBIT_SPOT_UNIUSDT
    
    execution:
      actor:
        - type: oms
          name: oms
          config:
            
    
