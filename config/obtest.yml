trading_mode: paper  # set to live to enable venue order submit/cancel

logger:
  level: debug
  output: stdout  # "stdout" or "file"
  path: /home/yite/BullionBear/seq/logs/obtest.log  # Required when output is "file"
  max_byte_size: 10485760  # 10 MB in bytes (0 = no rotation)
  max_backup_files: 5  # Maximum number of backup files to keep (0 = keep all)

msgbus:
  msglog:
    enabled: true
    dir: ./logs/

catalog:
  instruments: ./instruments.json  # relative to this config file's directory

node:
  engine:
    data:
      subscriptions:
        - symbol: BYBIT_SPOT_BTCUSDT
          depth:
            levels: 50
      actor:
        - type: orderbook
          config:
            symbol: BYBIT_SPOT_BTCUSDT

    execution:
      actor: []

    ledger:
      actor: []

    strategy:
      actor:
        - type: obtest
          config:
            symbol_universal_ticker: BYBIT_SPOT_BTCUSDT
