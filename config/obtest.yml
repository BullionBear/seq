trading_mode: paper  # set to live to enable venue order submit/cancel

logger:
  level: debug
  output: stdout  # "stdout" or "file"
  path: ./logs/obtest.log  # Required when output is "file"
  max_byte_size: 10485760  # 10 MB in bytes (0 = no rotation)
  max_backup_files: 5  # Maximum number of backup files to keep (0 = keep all)

msgbus:
  msglog:
    enabled: true
    dir: ./logs/

catalog:
  instruments: ./instruments.json  # relative to this config file's directory

node:
  engine:
    data:
      subscriptions:
        - symbol: BINANCE_PERPETUAL_ETHUSDT
          depth:
            type: delta
            push_rate: 100ms


    execution:
      actor: []

    ledger:
      actor: []

    strategy:
      actor:
        - type: obtest
          config:
            symbol_universal_ticker: BINANCE_PERPETUAL_ETHUSDT

datarouter:
  - symbol: BINANCE_PERPETUAL_ETHUSDT
    depth:
      type: delta
      push_rate: 100ms
