trading_mode: paper  # live requires trading_mode=live AND SEQ_ALLOW_LIVE=1 (CEO/board approval)

logger:
  level: debug
  output: stdout  # "stdout" or "file"
  path: /home/yite/BullionBear/seq/logs/obtest.log  # Required when output is "file"
  max_byte_size: 10485760  # 10 MB in bytes (0 = no rotation)
  max_backup_files: 5  # Maximum number of backup files to keep (0 = keep all)

msgbus:
  msglog:
    enabled: true
    dir: ./logs/

catalog:
  base_url: https://capi.lynxlinkage.com
  # Set CATALOG_API_TOKEN in the environment, or copy to a gitignored *.local.yml
  api_token: ${CATALOG_API_TOKEN}

node:
  engine:
    data:
      subscriptions:
        - symbol: BYBIT_SPOT_BTCUSDT
          depth:
            levels: 50
      actor:
        - type: orderbook
          config:
            symbol: BYBIT_SPOT_BTCUSDT

    execution:
      actor: []

    portfolio:
      actor: []

    strategy:
      actor:
        - type: obtest
          config:
            symbol_universal_ticker: BYBIT_SPOT_BTCUSDT
