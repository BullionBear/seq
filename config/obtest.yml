trading_mode: paper  # set to live to enable venue order submit/cancel

logger:
  level: debug
  stdout: true
  file:
    dir: ./logs
    name: obtest
    max_bytes: 10485760
    daily: true
    max_backups: 5
    max_age_days: 0
    sync: rotate

msgbus:
  msglog:
    enabled: true
    file:
      dir: ./logs
      name: msg
      max_bytes: 104857600
      daily: true
      max_backups: 10
      max_age_days: 7
      sync: rotate

catalog:
  instruments: ./instruments.json  # relative to this config file's directory

node:
  engine:
    data:
      subscriptions:
        - symbol: BINANCE_PERPETUAL_ETHUSDT
          depth:
            type: delta
            push_rate: 100ms


    execution:
      actor: []

    ledger:
      actor: []

    strategy:
      actor:
        - type: obtest
          config:
            symbol_universal_ticker: BINANCE_PERPETUAL_ETHUSDT

datarouter:
  - symbol: BINANCE_PERPETUAL_ETHUSDT
    depth:
      type: delta
      push_rate: 100ms
